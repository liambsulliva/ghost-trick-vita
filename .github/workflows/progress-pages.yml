name: Progress treemap

on:
  push:
    branches:
      - asset-inventory
    paths:
      - .github/workflows/progress-pages.yml
      - config/arm9/**
      - config/decomp_progress.json
      - docs/progress-treemap.svg
      - src/**
      - tests/test_progress_treemap.py
      - tools/progress_treemap.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Check the generator
        run: |
          python3 -I -m unittest discover -s tests -p test_progress_treemap.py
          python3 -I tools/progress_treemap.py --check
      - name: Build the progress viewer
        run: >-
          python3 -I tools/progress_treemap.py
          --site-dir build/progress-site
          --source-url "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/progress-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the progress viewer
        id: deployment
        uses: actions/deploy-pages@v4
