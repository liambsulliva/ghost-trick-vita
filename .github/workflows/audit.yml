name: rom-audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the audit
        run: python3 tools/rom_audit.py --self-test
      - name: Audit the tree
        run: python3 tools/rom_audit.py
      - name: Check the script decoder and animation mapping
        run: python3 -I -m unittest discover -s tests
