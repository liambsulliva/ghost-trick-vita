name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish, such as v1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Install the build tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash git make python3
          else
            apt-get update && apt-get install -y --no-install-recommends git make python3
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tag matches the app version
        run: |
          version="${TAG#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          expected=$(printf '%02d.%02d' "$major" "$minor")
          actual=$(sed -n 's/^APP_VER *:= *//p' srcVita/Makefile)
          if [ "$expected" != "$actual" ]; then
            echo "Tag $TAG needs APP_VER $expected in srcVita/Makefile, but it is $actual."
            exit 1
          fi

      - name: Write the release notes
        run: |
          case "$TAG" in
            v0.9.1-beta)
              changes='- **LiveArea art:** The home-screen icon, background and startup banner are original now: a blue fire from Twemoji on near-black, with no game art. A package you build with the game'"'"'s files keeps the remaster logo.'
              ;;
            *)
              echo "Add the $TAG bullets to the case in this step before tagging $TAG."
              exit 1
              ;;
          esac
          bad=$(printf '%s\n' "$changes" | grep -vE '^- \*\*[^*]+:\*\* .+' || true)
          if [ -n "$bad" ]; then
            echo "The $TAG bullets must be '- **Name:** text' lines. These do not match:"
            echo "$bad"
            exit 1
          fi
          mkdir -p dist
          {
            echo "- **Install:** Install \`ghosttrick-$TAG.vpk\` with VitaShell. It holds only the app, so it needs the game's art, sound, text and scripts converted from your own copies, as the [README](https://github.com/${{ github.repository }}#run-it-on-a-vita) explains. After updating, run the setup script again and copy both sets across again."
            printf '%s\n' "$changes"
            echo "- **Debug build:** \`ghosttrick-$TAG-debug.vpk\` is the same version with the run log and the developer options. Install it only to capture a log for a bug report."
          } > dist/release-notes.md

      - name: Audit the tree for game data
        run: python3 tools/rom_audit.py

      - name: Install the app's libraries
        run: vdpm vitaGL vitaShaRK SceShaccCgExt libmathneon taihen

      - name: Build the release package
        run: |
          mkdir -p dist
          make -C srcVita release
          cp srcVita/build/ghosttrick.vpk "dist/ghosttrick-$TAG.vpk"

      - name: Build the debug package, which writes the run log
        run: |
          make -C srcVita release-debug
          cp srcVita/build/ghosttrick.vpk "dist/ghosttrick-$TAG-debug.vpk"

      - name: Write the checksums
        run: cd dist && sha256sum "ghosttrick-$TAG.vpk" "ghosttrick-$TAG-debug.vpk" > "ghosttrick-$TAG.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ghosttrick-${{ env.TAG }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghosttrick-${{ env.TAG }}
          path: dist/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/ghosttrick-${{ env.TAG }}.vpk
            dist/ghosttrick-${{ env.TAG }}-debug.vpk
            dist/ghosttrick-${{ env.TAG }}.sha256
          body_path: dist/release-notes.md
