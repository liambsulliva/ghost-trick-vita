name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish, such as v1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Install the build tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash git make python3
          else
            apt-get update && apt-get install -y --no-install-recommends git make python3
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tag matches the app version
        run: |
          version="${TAG#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          expected=$(printf '%02d.%02d' "$major" "$minor")
          actual=$(sed -n 's/^APP_VER *:= *//p' srcVita/Makefile)
          if [ "$expected" != "$actual" ]; then
            echo "Tag $TAG needs APP_VER $expected in srcVita/Makefile, but it is $actual."
            exit 1
          fi

      - name: Audit the tree for game data
        run: python3 tools/rom_audit.py

      - name: Install the app's libraries
        run: vdpm vitaGL vitaShaRK SceShaccCgExt libmathneon taihen

      - name: Build the release package
        run: make -C srcVita release

      - name: Name the package and its checksum
        run: |
          mkdir -p dist
          cp srcVita/build/ghosttrick.vpk "dist/ghosttrick-$TAG.vpk"
          cd dist && sha256sum "ghosttrick-$TAG.vpk" > "ghosttrick-$TAG.vpk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ghosttrick-${{ env.TAG }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghosttrick-${{ env.TAG }}
          path: dist/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Ghost Trick Vita ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ghosttrick-${{ env.TAG }}.vpk
            dist/ghosttrick-${{ env.TAG }}.vpk.sha256
          body: |
            Install `ghosttrick-${{ env.TAG }}.vpk` with VitaShell. The package holds only the app: it needs the game's art, sound, text and scripts converted from your own copies of the game, as the [README](https://github.com/${{ github.repository }}#run-it-on-a-vita) explains. After updating, run the setup script again and copy both sets across again.
